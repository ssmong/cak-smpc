defaults:
  - sc: sc_default
  - controller: ukf_smpc
  - constraint: default
  - noise: ukf_exp1a
  - _self_

sim:
  sim_time: 50.0
  sim_dt: 0.01
  ctrl_dt: 0.1
  log_dt: 0.1

env:
  gravity_order: 4
  include_sun: true
  enable_drag: true
  enable_srp: true
  enable_gg: true

# Batch experiments (run all if experiments key exists)
experiments:
  - sc: exp1a
    constraint: exp1a
    noise: ukf_exp1a
    desc: "Constant MOI (In-Distribution)"
  - sc: exp1b
    constraint: exp1b
    noise: ukf_exp1b
    desc: "Constant MOI (Non-Diagonal Mismatch)"
  - sc: exp2a
    constraint: exp2a
    noise: ukf_exp2a
    desc: "Continuous MOI Drift"
  - sc: exp2b
    constraint: exp1b
    noise: ukf_exp2b
    desc: "Abrupt MOI Change"

seed: 42

hydra:
  run:
    dir: outputs/calibrate_ukf/${now:%Y-%m-%d}/${now:%H-%M-%S}
