defaults:
  - sc: sc_default
  - constraint: default
  - _self_

sim:
  sim_time: 50.0
  sim_dt: 0.01
  log_dt: 0.01
  ctrl_dt: 0.01          # default; overridden per controller

env:
  gravity_order: 4
  enable_drag: true
  enable_srp: true
  enable_gg: true

# Experiment matrix (same structure as mc_*.yaml)
# Each experiment specifies its own sc and constraint config.
experiments:
  # - sc: exp1a
  #   constraint: exp1a
  #   desc: "Constant MOI (In-Distribution)"
  # - sc: exp1b
  #   constraint: exp1b
  #   desc: "Constant MOI (Non-Diagonal)"
  - sc: exp2a
    constraint: exp2a
    desc: "Continuous MOI Drift"
  # - sc: exp2b
  #   constraint: exp2b
  #   desc: "Abrupt MOI Change"
#  - sc: exp3
#    constraint: exp1b
#    desc: "Constant MOI (OOD)"

# Controllers to compare.
# Each entry:
#   key       - folder name in output directory (also used by MATLAB plotter)
#   config    - matches configs/controller/{config}.yaml
#   ctrl_dt   - control timestep for this controller
#   overrides - (optional) merged into controller config before instantiation
controllers:
  - key: nmpc
    config: nmpc
    ctrl_dt: 0.5
  - key: lsmpc
    config: lsmpc
    ctrl_dt: 0.5
    noise_prefix: lsmpc
    overrides:
      cc:
        alpha: 0.95
  - key: ukf_smpc
    config: ukf_smpc
    ctrl_dt: 0.1
    noise_prefix: ukf
  - key: asgp_fast
    config: asgp_smpc
    ctrl_dt: 0.5
    overrides:
      exp_name: auto
      gp:
        mode: fast
      cc:
        alpha: 0.95
  - key: party
    config: party_smpc
    ctrl_dt: 0.1
    overrides:
      cc:
        alpha: 0.95

seed: 42

# Seed sweep: run multiple trials with different SimpleNav RNG seeds,
# cherry-pick worst-case episode per baseline controller independently.
# n_trials=1 disables sweep (default deterministic comparison).
sweep:
  num_trials: 100          # number of trials per baseline controller
  pick_rank: 1             # 1 = worst, 5 = 5th-worst (95th percentile at n=100)
  num_workers: 20          # parallel workers for scoring pass (>1 = multiprocessing)
  perturb_deg: 0.0         # max random rotation applied to q_init each trial (0 = off)
  exclude_from_ranking:    # controllers excluded from sweep (run once with default seed)
    - party

hydra:
  run:
    dir: outputs/comparison/${now:%Y-%m-%d}/${now:%H-%M-%S}
