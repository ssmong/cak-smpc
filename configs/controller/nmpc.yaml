R_diag: [1.0, 1.0, 1.0]
F_diag: [100.0, 100.0, 100.0, 100.0, 100.0, 100.0]
du_weight: 1.0
rho: 1e6
max_iter: 100

integrator_steps: 5  # This option is directly related to the time efficiency