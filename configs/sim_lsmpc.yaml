defaults:
  - sc: sc_default
  - controller: lsmpc
  - constraint: default
  - noise: lsmpc_exp1a
  - _self_

sim:
  sim_time: 50.0
  sim_dt: 0.01
  ctrl_dt: 0.5
  log_dt: 0.1

env:
  gravity_order: 4
  include_sun: true
  enable_drag: true
  enable_srp: true
  enable_gg: true


seed: 42

hydra:
  run:
    dir: outputs/${hydra:runtime.choices.controller}/${now:%Y-%m-%d}/${now:%H-%M-%S}
