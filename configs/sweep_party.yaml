method: bayes
metric:
  name: val/total
  goal: minimize
command:
  - ${env}
  - python
  - "-m"
  - "scripts.2_train_party"
  - ${args_no_hyphens}
  - "train.epochs=200"
parameters:
  model.rho_max_A:
    distribution: uniform
    min: 1.01
    max: 1.1
  model.hk_dim:
    values: [64, 96]
  train.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.001
  train.batch_size:
    values: [128, 256]
  train.weights.geodesic:
    values: [0.0, 0.0001, 0.00001]
  train.weights.ctx_smooth:
    values: [0.0, 0.0001, 0.00001]
  train.weight_decay:
    distribution: log_uniform_values 
    min: 0.0001
    max: 0.005